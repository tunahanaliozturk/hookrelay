name: hookrelay

# The two minute demo. `docker compose up --build` brings up the database, the broker, all three services,
# and a receiver that fails 30% of the time on purpose, which is the state the README's numbers come from.

x-hookrelay-env: &hookrelay-env
  ConnectionStrings__hookrelay: Host=postgres;Database=hookrelay;Username=hookrelay;Password=hookrelay
  HookRelay__Kafka__BootstrapServers: kafka:9092
  # Generated per run in the Aspire host. Fixed here so all three containers agree, and only ever used
  # against a throwaway database. A real deployment injects a key from a secret store.
  HookRelay__SecretProtection__Key: ${HOOKRELAY_SECRET_KEY:-Ke8dJcJ8gGZ3PqTfWl5nR0vXyBt7uS2aMhQ4cV6oNdE=}
  # The receiver runs on plain http inside the compose network, which the delivery policy refuses by
  # default. Both switches stay off anywhere real.
  HookRelay__Delivery__AllowInsecureHttp: "true"
  HookRelay__Delivery__AllowPrivateNetworkDestinations: "true"
  DOTNET_ENVIRONMENT: Development

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  chaos-receiver:
    build:
      context: .
      args:
        PROJECT: HookRelay.ChaosReceiver
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      # A receiver that always answers 200 would make every number below meaningless.
      CHAOS_FAILURE_RATE: "0.3"
      CHAOS_LATENCY_MS: "25"
    ports:
      - "5005:8080"

  api:
    build:
      context: .
      args:
        PROJECT: HookRelay.Api
    environment:
      <<: *hookrelay-env
      ASPNETCORE_HTTP_PORTS: "8080"
      HookRelay__MigrateOnStartup: "true"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  relay:
    build:
      context: .
      args:
        PROJECT: HookRelay.Relay
    environment: *hookrelay-env
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        PROJECT: HookRelay.Worker
    environment: *hookrelay-env
    # Delivery is where the work is, so this is the service that scales out.
    deploy:
      replicas: 2
    depends_on:
      api:
        condition: service_started
      chaos-receiver:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
